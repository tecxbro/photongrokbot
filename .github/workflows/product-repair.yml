name: Product regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Local media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3
      - name: Isolated regression and clean build
        run: node scripts/test-product.mjs all
